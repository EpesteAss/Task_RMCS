# Four-second pure 1 Hz Yaw torque sine with equal +/-1.25 Nm peaks.
# Pitch motor command remains zero. Pitch CAN feedback is currently unavailable,
# so this mode relies on the external clamp and a measured Yaw shell temperature.
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
    - rmcs_core::hardware::DeformableInfantryOmniC -> deformable_infantry
    - rmcs_core::referee::Status -> referee_status
    - yaw_identification::Controller -> yaw_experiment
    - rmcs_core::debug::ValueCollector -> yaw_collector
deformable_infantry:
  ros__parameters:
    serial_filter_bottom_board: AF-C1C3-DFE8-40A8-FC4B-B853-6ED7-AC9F-1DED
    serial_filter_top_board: AF-ABAC-786D-1B53-99F6-00A2-42A6-AA95-9D69
    chassis_radius: 0.2341741
    rod_length: 0.14
    yaw_motor_zero_point: 38910
    pitch_motor_zero_point: 7093
yaw_experiment:
  ros__parameters:
    allow_arm: true
    allow_sweep: true
    physical_identification: true
    passive_pitch: true
    mechanically_fixed_pitch: true
    fixed_pitch_external_pose_deg: 5.0  # record only; Pitch encoder pose is unavailable
    passive_pitch_world_min_deg: 3.0     # not enforced in mechanically fixed mode
    passive_pitch_world_max_deg: 7.0     # not enforced in mechanically fixed mode
    yaw_temperature_trip_c: 130.0
    tracking_test: false
    rich_identification: false
    physical_frequencies_hz: [0.5, 1.0, 2.0]
    physical_start_profile: 1  # 1 Hz, four complete cycles in 4 s.
    physical_pure_sine: true
    physical_step_pulse: false
    physical_alternating_pulses: false
    physical_guard_fraction: 0.8
    physical_start_speed_rad_s: 0.03
    duration: 4.0
    sweep_amplitude: 1.25
    yaw_torque_limit: 1.35
    yaw_torque_slew_Nm_s: 20.0
    yaw_torque_release_slew_Nm_s: 20.0
    yaw_speed_trip_rad_s: 3.6  # Guard at 2.88 rad/s; hard stop at 3.6 rad/s.
    yaw_span_rad: 3.141592653589793  # Continuous Yaw; guard remains at +/-144 deg per trial.
    tracking_amplitude_deg: 5.0  # Inactive in physical mode; must fit the span validation.
    world_pitch_control: true
    pitch_limits_relative_to_arm: true
    world_pitch_target_deg: 5.0
    pitch_target_deg: -18.0
    pitch_ready_tolerance_deg: 1.5
    min_world_pitch_deg: 0.0
    pitch_min: -0.6
    pitch_max: 0.1
    pitch_ramp_rad_s: 0.1832595714594046
    pitch_target_lead_limit_deg: 0.8
    pitch_target_soft_tau_s: 0.05
    pitch_stiction_compensation_Nm: 0.1
    pitch_precharge_s: 0.4
    pitch_precharge_torque_slew_Nm_s: 8.0
    pitch_start_ramp_s: 0.3
    pitch_torque_limit: 0.01
    pitch_torque_slew_Nm_s: 6.0
    pitch_torque_release_slew_Nm_s: 30.0
    pitch_off_slew_Nm_s: 1.0
    pitch_velocity_filter_tau_s: 0.012
    pitch_gravity_ff_gain: 3.5
    pitch_gravity_ff_raise_gain: 3.45
    pitch_gravity_ff_phase: 1.784
    pitch_angle_output_min: -6.0
    pitch_angle_output_max: 6.0
    pitch_velocity_output_min: -20.0
    pitch_velocity_output_max: 20.0
    pitch_angle_kp: 35.0
    pitch_angle_ki: 0.02
    pitch_angle_kd: 0.3
    pitch_angle_integral_min: -0.5
    pitch_angle_integral_max: 0.5
    pitch_velocity_kp: 2.0
    pitch_velocity_ki: 0.0
    pitch_velocity_kd: 0.0
yaw_collector:
  ros__parameters:
    csv_path: /tmp/c_yaw_physical_<timestamp>.csv
    signals:
    - /gimbal/yaw/angle
    - /gimbal/yaw/velocity
    - /gimbal/yaw/velocity_imu
    - /gimbal/yaw/torque
    - /gimbal/yaw/control_torque
    - /gimbal/yaw/temperature
    - /gimbal/pitch/angle
    - /gimbal/pitch/velocity_imu
    - /gimbal/pitch/control_torque
    - /gimbal/pitch/torque
    - /gimbal/pitch/temperature
    - /yaw_experiment/state
    - /yaw_experiment/fault
    - /yaw_experiment/completed
    - /yaw_experiment/time_s
    - /yaw_experiment/excitation
    - /yaw_experiment/excitation_profile
    - /yaw_experiment/tracking_frequency_hz
    - /yaw_experiment/physical_identification
    - /yaw_experiment/passive_pitch
    - /yaw_experiment/mechanically_fixed_pitch
    - /yaw_experiment/yaw_pid_torque
    - /yaw_experiment/yaw_feedforward
    - /yaw_experiment/physical_guard_stop
    - /yaw_experiment/pitch_world
    write_interval: 10
    flush_interval: 1
