<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
<rect width="1000" height="600" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="17" fill="#25364d">
<text x="90" y="38" font-size="24" font-weight="bold">Frozen model: velocity fit across held-out waveforms</text>
<text x="300" y="70">Same 1.3–3.3 s evaluation window; higher is better</text>
<path d="M 340.3 103 V 485" stroke="#dbe3ed"/>
<text x="340.3" y="513" text-anchor="middle">-50%</text>
<path d="M 541.9 103 V 485" stroke="#dbe3ed"/>
<text x="541.9" y="513" text-anchor="middle">0%</text>
<path d="M 743.4 103 V 485" stroke="#dbe3ed"/>
<text x="743.4" y="513" text-anchor="middle">50%</text>
<path d="M 945.0 103 V 485" stroke="#dbe3ed"/>
<text x="945.0" y="513" text-anchor="middle">100%</text>
<path d="M 541.9 103 V 485" stroke="#25364d" stroke-width="2"/>
<text x="210" y="126" text-anchor="end">0.9 Nm square</text>
<rect x="541.9" y="105" width="364.3" height="30" rx="3" fill="#1565c0"/>
<text x="915.1" y="126" font-weight="bold">90.4%</text>
<text x="210" y="187" text-anchor="end">0.5 Nm square</text>
<rect x="541.9" y="166" width="109.2" height="30" rx="3" fill="#1565c0"/>
<text x="660.0" y="187" font-weight="bold">27.1%</text>
<text x="210" y="248" text-anchor="end">Hann 0.5 Hz +</text>
<rect x="355.1" y="227" width="186.8" height="30" rx="3" fill="#c0392b"/>
<text x="448.5" y="248" text-anchor="middle" fill="white" font-weight="bold">-46.3%</text>
<text x="210" y="309" text-anchor="end">Hann 0.5 Hz reverse</text>
<rect x="541.9" y="288" width="283.4" height="30" rx="3" fill="#c0392b"/>
<text x="834.3" y="309" font-weight="bold">70.3%</text>
<text x="210" y="370" text-anchor="end">Pure sine 0.5 Hz +</text>
<rect x="541.9" y="349" width="345.1" height="30" rx="3" fill="#d35400"/>
<text x="895.9" y="370" font-weight="bold">85.6%</text>
<text x="210" y="431" text-anchor="end">Pure sine 0.5 Hz reverse</text>
<rect x="541.9" y="410" width="356.5" height="30" rx="3" fill="#d35400"/>
<text x="907.3" y="431" font-weight="bold">88.4%</text>
<text x="300" y="555" font-size="15">Blue: square  |  Red: Hann-windowed cosine  |  Orange: symmetric pure sine</text>
</g></svg>
